
<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Login to Bot</title>
        <link rel="stylesheet" href="/static/auth/styles.css"/>
        <link rel="icon" type="image/x-icon" href="/favicon.ico">
    </head>
    <body>
        <div id="container">
            <div id="icon">
                <img src="/favicon.ico" alt="Bot Icon">
            </div>

            <h1 id="title">Discord Login</h1>

            <p id="desc">
                To access the bot's dashboard, you'll need to authenticate
                with Discord.
            </p>

            <a id="login-button" href="/auth/discord/login">
                Login with Discord
            </a>

            <p id="footer">
                Secure authentication powered by Discord
            </p>
        </div>
    </body>
</html>
